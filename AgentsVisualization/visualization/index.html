<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Simulation - 3D Visualization</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦋</text></svg>">
    <link rel="stylesheet" href="/css/styles.css">
    <script defer type="module" src="random_agents.js"></script>
</head>

<body>
    <div id='headerContainer'>
        <div class="header-content">
            <h1>🦋 Traffic Simulation Visualization</h1>
            <p class="subtitle">Real-time 3D Multi-Agent System</p>
        </div>
    </div>
    <div id="stats-overlay">
        <h2 class="stats-title">Simulation Stats</h2>
        <div class="stat-item">
            <span class="stat-label">Total Steps:</span>
            <span id="stat-steps" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Total Spawned:</span>
            <span id="stat-total" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Currently Active:</span>
            <span id="stat-active" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Reached Destination:</span>
            <span id="stat-reached" class="stat-value">0</span>
        </div>
        <div id="simulation-status" class="stat-item" style="display: none;">
            <span class="stat-label">Status:</span>
            <span class="stat-value stat-warning">STOPPED</span>
        </div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- Background music -->
    <audio id="backgroundMusic" loop>
        <source src="/assets/C418   Minecraft Music Slowed Down  With Rain  1 hour.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Auto-play music when page loads
        window.addEventListener('load', () => {
            const music = document.getElementById('backgroundMusic');
            music.volume = 0.3; // Set volume to 30%

            // Play music on first user interaction
            const playMusic = () => {
                music.muted = false;
                music.play().catch(err => console.log('Music playback failed:', err));
                document.removeEventListener('click', playMusic);
                document.removeEventListener('keydown', playMusic);
            };

            document.addEventListener('click', playMusic, { once: true });
            document.addEventListener('keydown', playMusic, { once: true });
        });
    </script>
</body>

</html>
