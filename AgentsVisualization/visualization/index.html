<!DOCTYPE html>
<html>
    <head>
        <title>API connection</title>
        <link rel="stylesheet" href="/css/styles.css">
        <script defer type="module" src="random_agents.js"></script>
    </head>

    <body>
        <div id='headerContainer'>
            <h1>API connection</h1>
        </div>
        <div id="stats-overlay">
            <div class="stat-item">
                <span class="stat-label">Total Spawned:</span>
                <span id="stat-total" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Currently Active:</span>
                <span id="stat-active" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Reached Destination:</span>
                <span id="stat-reached" class="stat-value">0</span>
            </div>
        </div>
        <canvas id="canvas"></canvas>
    </body>
</html>
